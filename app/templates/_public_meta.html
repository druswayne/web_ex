<meta name="description" content="{{ seo_description }}">
{% if seo_keywords %}
<meta name="keywords" content="{{ seo_keywords }}">
{% endif %}
<meta name="author" content="Математика 9">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="format-detection" content="telephone=no">
<link rel="canonical" href="{{ seo_url }}">
<link rel="sitemap" type="application/xml" title="Sitemap" href="{{ site_base }}/sitemap.xml">
<link rel="alternate" hreflang="ru" href="{{ seo_url }}">
<link rel="alternate" hreflang="x-default" href="{{ seo_url }}">
<link rel="image_src" href="{{ site_base }}{{ url_for('static', filename='og.png') }}">
<meta property="og:locale" content="ru_RU">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Математика 9">
<meta property="og:title" content="{{ seo_title }}">
<meta property="og:description" content="{{ seo_description }}">
<meta property="og:url" content="{{ seo_url }}">
<meta property="og:image" content="{{ site_base }}{{ url_for('static', filename='og.png') }}">
{% if site_base.startswith('https://') %}
<meta property="og:image:secure_url" content="{{ site_base }}{{ url_for('static', filename='og.png') }}">
{% endif %}
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Математика 9 — подготовка к выпускному экзамену">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo_title }}">
<meta name="twitter:description" content="{{ seo_description }}">
<meta name="twitter:image" content="{{ site_base }}{{ url_for('static', filename='og.png') }}">
<meta name="twitter:image:alt" content="Математика 9 — подготовка к выпускному экзамену">
{% if seo_google %}
<meta name="google-site-verification" content="{{ seo_google }}">
{% endif %}
{% if seo_yandex %}
<meta name="yandex-verification" content="{{ seo_yandex }}">
{% endif %}
{% if seo_bing %}
<meta name="msvalidate.01" content="{{ seo_bing }}">
{% endif %}
{% if seo_facebook %}
<meta name="facebook-domain-verification" content="{{ seo_facebook }}">
{% endif %}
<script type="application/ld+json">
{{ seo_json | tojson }}
</script>
